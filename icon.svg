<svg xmlns="http://www.w3.org/2000/svg" viewBox="212 150 600 600" width="512" height="512">
<!-- The browser tab icon, cut from build/app-icon.svg by npm run icons. Do not edit by hand. -->
<defs><clipPath id="icon_cut"><rect x="212" y="150" width="600" height="600" rx="120"/></clipPath></defs>
<g clip-path="url(#icon_cut)"><defs>
<linearGradient id="app-icon-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a110b"/><stop offset="0.22" stop-color="#9c2a14"/><stop offset="0.42" stop-color="#e8502a"/><stop offset="0.58" stop-color="#f4a050"/><stop offset="1" stop-color="#f4a050"/></linearGradient>
<radialGradient id="app-icon-glow"><stop offset="0" stop-color="#fff3cf" stop-opacity="0.95"/><stop offset="0.55" stop-color="#ffb65a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff7a2e" stop-opacity="0"/></radialGradient>
<radialGradient id="app-icon-sun"><stop offset="0" stop-color="#fffdf0"/><stop offset="0.7" stop-color="#fff0c0"/><stop offset="1" stop-color="#ffd27a"/></radialGradient>
<linearGradient id="app-icon-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a1c10"/><stop offset="0.3" stop-color="#1c0c08"/><stop offset="1" stop-color="#1c0c08"/></linearGradient>
<radialGradient id="app-icon-spill"><stop offset="0" stop-color="#ffa64e" stop-opacity="0.8"/><stop offset="0.5" stop-color="#e8502a" stop-opacity="0.3"/><stop offset="1" stop-color="#e8502a" stop-opacity="0"/></radialGradient>
<linearGradient id="app-icon-lid" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="640"><stop offset="0" stop-color="#170807"/><stop offset="0.4" stop-color="#2e100a"/><stop offset="1" stop-color="#a84018"/></linearGradient>
<linearGradient id="app-icon-mouth" gradientUnits="userSpaceOnUse" x1="0" y1="636" x2="0" y2="730"><stop offset="0" stop-color="#8a3014"/><stop offset="0.5" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffe2a0"/></linearGradient>
<linearGradient id="app-icon-column" gradientUnits="userSpaceOnUse" x1="0" y1="660" x2="0" y2="300"><stop offset="0" stop-color="#ffc066" stop-opacity="0.6"/><stop offset="0.5" stop-color="#ff9a48" stop-opacity="0.16"/><stop offset="1" stop-color="#ff9a48" stop-opacity="0"/></linearGradient>
</defs>
